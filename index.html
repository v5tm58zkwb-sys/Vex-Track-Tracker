
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172554">
  <title>VEX Track Tracker</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1, h2 {
      text-align: center;
    }

    .panel {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: #475569;
    }

    button.danger {
      background: #dc2626;
    }

    video {
      display: block;
      width: 100%;
      max-height: 400px;
      background: black;
      border-radius: 10px;
      margin-top: 12px;
    }

    #status {
      font-weight: bold;
      margin-top: 10px;
    }

    #cameraMessage {
      color: #475569;
    }

    .progressBackground {
      height: 18px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #16a34a;
      transition: width .3s;
    }

    #track {
      width: 100%;
      max-width: 550px;
      display: block;
      margin: 15px auto;
    }

    .stopMarker {
      fill: #cbd5e1;
      stroke: #334155;
      stroke-width: 2;
    }

    .stopMarker.visited {
      fill: #22c55e;
    }

    #trackCar {
      transition: transform .6s ease;
    }

    .photoGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .photoCard {
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      min-width: 0;
    }

    .photoCard img {
      width: 100%;
      border-radius: 8px;
    }

    .photoCard a {
      display: inline-block;
      margin-top: 8px;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>VEX Track Tracker</h1>

    <div class="panel">
      <h2>Camera</h2>

      <button id="startButton">Start Camera</button>
      <button id="stopButton" class="secondary">Stop Camera</button>
      <button id="manualButton" class="secondary">Manual Capture</button>
      <button id="resetButton" class="danger">Reset Stops</button>

      <video id="video" autoplay playsinline muted></video>

      <p id="cameraState">Camera is stopped.</p>
      <p id="cameraMessage">Press Start Camera to begin scanning QR codes.</p>
      <p id="status">Waiting for a QR code...</p>
      <p id="connection" class="muted">Ready</p>
    </div>

    <div class="panel">
      <h2>Track Map</h2>

      <svg id="track" viewBox="0 0 340 260"
           xmlns="http://www.w3.org/2000/svg">

        <!-- Track outline -->
        <rect x="55" y="35" width="230" height="180"
              rx="65" ry="65"
              fill="none"
              stroke="#334155"
              stroke-width="24"/>

        <!-- Bridge on top short side -->
        <path d="M145 23 L195 23"
              stroke="#f59e0b"
              stroke-width="30"
              stroke-linecap="round"/>

        <path d="M145 23 L195 23"
              stroke="#ffffff"
              stroke-width="3"
              stroke-dasharray="7 5"/>

        <!-- Bridge on bottom short side -->
        <path d="M145 227 L195 227"
              stroke="#f59e0b"
              stroke-width="30"
              stroke-linecap="round"/>

        <path d="M145 227 L195 227"
              stroke="#ffffff"
              stroke-width="3"
              stroke-dasharray="7 5"/>

        <!-- Stop markers -->
        <circle id="marker-STOP1" class="stopMarker"
                cx="105" cy="35" r="14"/>
        <circle id="marker-STOP2" class="stopMarker"
                cx="235" cy="35" r="14"/>
        <circle id="marker-STOP3" class="stopMarker"
                cx="235" cy="215" r="14"/>
        <circle id="marker-STOP4" class="stopMarker"
                cx="105" cy="215" r="14"/>

        <!-- Stop labels -->
        <g font-size="11" text-anchor="middle" fill="#172033">
          <text x="105" y="12">STOP 1</text>
          <text x="235" y="12">STOP 2</text>
          <text x="235" y="250">STOP 3</text>
          <text x="105" y="250">STOP 4</text>
        </g>

        <!-- Moving car icon -->
        <g id="trackCar" transform="translate(105 35)">
          <rect x="-12" y="-8" width="24" height="16"
                rx="5" fill="#2563eb"
                stroke="#ffffff" stroke-width="2"/>
          <circle cx="-7" cy="-9" r="3" fill="#172033"/>
          <circle cx="7" cy="-9" r="3" fill="#172033"/>
          <circle cx="-7" cy="9" r="3" fill="#172033"/>
          <circle cx="7" cy="9" r="3" fill="#172033"/>
        </g>
      </svg>

      <p id="trackPosition" style="text-align:center;">
        Car position: Waiting for first stop
      </p>
    </div>

    <div class="panel">
      <h2>Stop Progress</h2>
      <p id="progressText">0 of 4 stops completed</p>

      <div class="progressBackground">
        <div id="progressBar"></div>
      </div>

      <p>Last detected stop: <strong id="lastStop">None</strong></p>
      <p>Next stop: <strong id="nextStop">STOP1</strong></p>
    </div>

    <div class="panel">
      <h2>Captured Photos</h2>
      <div id="gallery" class="photoGrid"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="./app.js"></script>
</body>
</html>
